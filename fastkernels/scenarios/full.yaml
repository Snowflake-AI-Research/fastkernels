# Full benchmark: every architecture in table.tex, each with the complete set
# of workloads for its modality.
#
# dtype follows the table's default-inference dtype (BF16->bfloat16,
# FP16->float16, FP32->float32, MXFP4->mxfp4; BitNet's W1.58 activations run in
# bfloat16). `tp` is sized to the checkpoint: dense <=8B and small
# vision/audio/science models run at tp=1; larger dense/MoE and 100B+ (MoE)
# models fan out to tp 2/4/8.
#
# Each scenario lists its workloads explicitly as `Family.member` tokens (the
# member names from the workload enums in workloads.py). Per-workload request
# counts and sequence lengths come from the workload specs in workloads.py
# (e.g. the LLM mixed=1000 / long-context=64 curated datasets), not this table.
# Optional per-scenario engine knobs `enforce_eager` (default false) and
# `max_num_seqs` (default null) may be added to any row.
#
# `model` is always a bare identifier -- an HF repo id, or a short module token
# for the rows with no Hub checkpoint (dlrmv2, lightgcn, dp3, ttt_e2e). Anything
# else a harness needs goes in its own optional field, never packed into the
# name: `draft_model`, `variant`, `scene`, `reference_checkpoint`.
#
# Checkpoint ids here are the ones the harnesses actually run. Where the paper
# table names a different release, the runnable id is used and the table's name
# is noted in a comment.

scenarios:
  # --- Dense & MoE LLMs ---
  - model: meta-llama/Llama-3.1-8B-Instruct
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  # DeepSeek-V3.2-Exp is excluded by default: at tp=8 its runtime dominates a
  # full sweep. Uncomment to include it.
  # - model: deepseek-ai/DeepSeek-V3.2-Exp
  #   tp: 8
  #   dtype: fp8
  #   workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: mistralai/Mixtral-8x7B-Instruct-v0.1
    tp: 2
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  # BitNet b1.58: the official 2B-4T release. bench_microsoft_bitnet's SOTA
  # reference is Microsoft's W2A8 CUDA kernel, which only reads this checkpoint's
  # native quantized format (the 1bitLLM/bitnet_b1_58-3B reproduction is a
  # llama-arch model with unpacked weights and does not load here).
  #
  # LLM.fixed_batch_32 is deliberately absent: the official int2 decode kernel
  # dispatches only for M == 1 (see bitnet_kernels.cu -- every branch requires
  # M == 1, and the kernel body is a GEMV with no row dimension), so the
  # reference cannot serve a batch at all. The sweep's latency table reports
  # speedups only, so a workload with no baseline contributes an empty cell;
  # running our side alone would measure into a void.
  - model: microsoft/bitnet-b1.58-2B-4T
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request]
  - model: openai/gpt-oss-120b
    tp: 2
    dtype: mxfp4
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  # EAGLE-3 speculative decoding: `model` is the target, `draft_model` the EAGLE-3
  # head. Both are required -- the draft weights are not a standalone model.
  - model: meta-llama/Llama-3.1-8B-Instruct
    draft_model: jamesliu1/sglang-EAGLE3-Llama-3.1-Instruct-8B
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: google/gemma-4-26B-A4B-it
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]

  # --- Linear Attention & New Archs ---
  - model: state-spaces/mamba-2.8b-hf
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: mistralai/Mamba-Codestral-7B-v0.1
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  # RWKV-7: table.tex names the 1.5B World model; 2.9B-g1 is the id bench_fla
  # lists as supported and is size-comparable with GLA/RetNet at 2.7B.
  - model: fla-hub/rwkv7-2.9B-g1
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: fla-hub/gla-2.7B-100B
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: fla-hub/retnet-2.7B-100B
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: Qwen/Qwen3-Next-80B-A3B-Instruct
    tp: 2
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: moonshotai/Kimi-Linear-48B-A3B-Instruct
    tp: 2
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  # TTT-E2E (Project Gutenberg contiguous text; random-init weights, no public ckpt)
  - model: ttt_e2e
    tp: 1
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]
  - model: ai21labs/AI21-Jamba-Mini-1.7
    tp: 2
    dtype: bfloat16
    workloads: [LLM.mixed, LLM.long_context, LLM.single_request, LLM.fixed_batch_32]

  # --- Vision / Video / Audio ---
  - model: black-forest-labs/FLUX.1-dev
    tp: 1
    dtype: bfloat16
    workloads: [Diffusion.res_1024, Diffusion.res_512, Diffusion.single_1024, Diffusion.single_512]
  # HunyuanVideo 1.5: the diffusers conversion of the 480p t2v variant. The
  # pipeline loads by subfolder (scheduler/tokenizer/text_encoder/...), which the
  # official tencent/HunyuanVideo-1.5 layout does not provide.
  - model: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_t2v
    tp: 1
    dtype: bfloat16
    workloads: [VideoDiffusion.p480_short, VideoDiffusion.p480_medium, VideoDiffusion.single_480p_short, VideoDiffusion.single_480p_medium]
  # SDXL: bench_diffusers loads with torch_dtype=bfloat16 (reading the
  # variant="fp16" files); SDXL's VAE overflows in fp16.
  - model: stabilityai/stable-diffusion-xl-base-1.0
    tp: 1
    dtype: bfloat16
    workloads: [Diffusion.res_1024, Diffusion.res_512, Diffusion.single_1024, Diffusion.single_512]
  # SAM 3.1 (table.tex: SAM 3): the reference builds an fp32 model and patches
  # sam3's fused addmm_act so it does not force bfloat16.
  - model: facebook/sam3.1
    tp: 1
    dtype: float32
    workloads: [Segmentation.gold_metaclip_nps, Segmentation.gold_wiki_common, Segmentation.gold_crowded, Segmentation.veval_sav_val, Segmentation.veval_yt1b_val, Segmentation.sav_val_video, Segmentation.smartglasses_val_video, Segmentation.single_image_1008, Segmentation.batch_4_image_1008, Segmentation.single_video_frame_1008]
  - model: openai/whisper-large-v3
    tp: 1
    dtype: float16
    workloads: [ASR.librispeech, ASR.single_utterance, ASR.fixed_batch_32]
  - model: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
    tp: 1
    dtype: bfloat16
    workloads: [TTS.tts_short, TTS.tts_medium, TTS.tts_long, TTS.single_utterance]

  # --- Multimodal & Encoders ---
  - model: Qwen/Qwen2-VL-7B-Instruct
    tp: 1
    dtype: bfloat16
    workloads: [VLM.text_only, VLM.image, VLM.video, VLM.single_image, VLM.single_video]
  - model: Qwen/Qwen3-VL-8B-Instruct      # table.tex: the FP8 release
    tp: 1
    dtype: bfloat16
    workloads: [VLM.text_only, VLM.image, VLM.video, VLM.single_image, VLM.single_video]
  - model: Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
    tp: 4
    dtype: fp8
    workloads: [VLM.text_only, VLM.image, VLM.video, VLM.single_image, VLM.single_video]
  - model: Qwen/Qwen2.5-Omni-7B
    tp: 1
    dtype: bfloat16
    workloads: [OmniModal.text, OmniModal.image, OmniModal.video, OmniModal.audio, OmniModal.single_text, OmniModal.single_image, OmniModal.single_video, OmniModal.single_audio]
  - model: google/siglip2-so400m-patch16-naflex
    tp: 1
    dtype: bfloat16
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]
  - model: facebook/dinov3-vit7b16-pretrain-lvd1689m
    tp: 1
    dtype: bfloat16
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]
  # SwinV2: bench_timm keys its registry on the timm id and loads both sides
  # through timm; the microsoft/ transformers release is not a lookup key.
  - model: timm/swinv2_large_window12_192.ms_in22k
    tp: 1
    dtype: bfloat16   # bench_timm runs its --dtype default
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]

  # --- Edge & Detection ---
  - model: timm/mobilenetv4_conv_medium.e500_r256_in1k
    tp: 1
    dtype: bfloat16   # bench_timm runs its --dtype default
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]
  - model: facebook/convnextv2-base-22k-384
    tp: 1
    dtype: float32
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]
  - model: timm/efficientnetv2_rw_m.agc_in1k
    tp: 1
    dtype: float32
    workloads: [VisionEncoder.default_res, VisionEncoder.high_res, VisionEncoder.single_image, VisionEncoder.batch_8]
  - model: jameslahm/yolov10n
    tp: 1
    dtype: float16
    workloads: [Detection.coco_val, Detection.single_image, Detection.batch_4]
  - model: PekingU/rtdetr_v2_r101vd
    tp: 1
    dtype: float16   # bench_detection --use-fp16 defaults to true
    workloads: [Detection.coco_val, Detection.single_image, Detection.batch_4]

  # --- 3D / Robotics / Science ---
  - model: Voxel51/gaussian_splatting
    scene: train
    tp: 1
    dtype: float32
    workloads: [Rendering.render, Rendering.single_render]
  # InstantNGP: the fastkernels path is fp32 end to end. Upstream pyngp is
  # internally fp16, but that is not what this row measures.
  - model: NVlabs/instant-ngp
    scene: fox
    tp: 1
    dtype: float32
    workloads: [Rendering.render, Rendering.single_render]
  - model: Pointcept/PointTransformerV3
    tp: 1
    dtype: float32
    workloads: [PointCloudSeg.scanobjectnn, PointCloudSeg.single_cloud, PointCloudSeg.batch_8]
  - model: OpenFold/OpenFold3
    tp: 1
    dtype: bfloat16
    workloads: [StructurePrediction.short, StructurePrediction.medium, StructurePrediction.long, StructurePrediction.extra_long, StructurePrediction.single_short, StructurePrediction.single_medium, StructurePrediction.single_long, StructurePrediction.single_extra_long]
  # pi0 (ALOHA pen_uncap): `model` names an OpenPI asset, which bench_openpi
  # resolves to the converted-PyTorch tree the provisioner materializes under
  # THIRD_PARTY_DIR (openpi publishes JAX/orbax trees; the PyTorch reference path
  # needs model.safetensors). Both engines load that same tree, which is what makes
  # the comparison like-with-like. `fastkernels validate` provisions it
  # automatically (component: openpi).
  # DROID and LIBERO need their own converted checkpoints; add their workloads
  # (droid-2cam / libero-2cam, droid-single / libero-single) once those exist.
  - model: pi0_aloha_pen_uncap
    tp: 1
    dtype: bfloat16
    workloads: [Robotics.aloha_3cam, Robotics.aloha_1cam, Robotics.aloha_single_3cam, Robotics.aloha_single_1cam]
  # DP3: dataset is rishabhrj11/gym-xarm-pointcloud (fixed in the harness);
  # `variant` selects Simple-DP3 vs the heavier full DP3 U-Net.
  - model: dp3
    variant: simple_dp3
    tp: 1
    dtype: float32
    workloads: [PointCloudPolicy.dp3_1env, PointCloudPolicy.dp3_batch, PointCloudPolicy.single_step, PointCloudPolicy.batch_8]

  # --- Recommendation & Specialized ---
  # DLRMv2 (Criteo 1TB not public -> scikit-learn/adult-census-income substitute)
  - model: dlrmv2
    tp: 1
    dtype: float32
    workloads: [Recsys.ctr_batch, Recsys.single_request, Recsys.fixed_batch_32]
  # LightGCN (GroupLens MovieLens-1M)
  - model: lightgcn
    tp: 1
    dtype: float32
    workloads: [Recsys.recommend_batch, Recsys.single_request, Recsys.fixed_batch_32]
  - model: BAAI/bge-m3
    tp: 1
    dtype: float16
    workloads: [Embedding.bge_m3_mldr_docs, Embedding.single_request, Embedding.fixed_batch_32]
  - model: colbert-ir/colbertv2.0
    tp: 1
    dtype: float16
    workloads: [Embedding.colbertv2_msmarco_passages, Embedding.single_request, Embedding.fixed_batch_32]
  - model: GSAI-ML/LLaDA-8B-Instruct
    tp: 1
    dtype: bfloat16
    workloads: [DiffusionLM.humaneval]

  # --- World Models ---
  - model: Etched/oasis-500m
    tp: 1
    dtype: float16   # bench_oasis hardcodes float16 on cuda
    workloads: [WorldModel.short_bs4_16f_4ddim, WorldModel.medium_bs8_24f_4ddim, WorldModel.long_bs8_32f_4ddim, WorldModel.denoise_bs4_16f_8ddim, WorldModel.latency_bs1_8f_4ddim]
  - model: facebook/vjepa2-vitl-fpc64-256
    tp: 1
    dtype: bfloat16
    workloads: [VideoRepresentation.predictor, VideoRepresentation.encoder, VideoRepresentation.classification, VideoRepresentation.single_video]
