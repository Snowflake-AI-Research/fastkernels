[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastkernels"
version = "0.1.0"
description = "A CUDA kernel benchmarking library for LLM inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "transformers",
    "huggingface_hub",
    "safetensors",
    "tqdm",
    "halo",
    "flash-attn",
    "vllm==0.24.0",
    # Pin the exact DeepGEMM commit vLLM 0.24 vendors (its __version__ is 2.5.0),
    # so fastkernels and vLLM use the identical fp8 GEMM / MQA-logits kernels.
    # Kept in sync with vllm's cmake/external_projects/deepgemm.cmake
    # (_DEEPGEMM_UPSTREAM_TAG) and tools/install_deepgemm.sh (DEEPGEMM_GIT_REF).
    "deep-gemm @ git+https://github.com/deepseek-ai/DeepGEMM.git@891d57b4db1071624b5c8fa0d1e51cb317fa709f",
    "decord",
    "mlflow>=2.10",
    "datasets",
    "diffusers>=0.37",
    "peft>=0.17.0",
    "sam3 @ git+https://github.com/sfc-gh-goliaro/sam3.git",
    # Pinned to the commit that stops openfold3 installing a top-level `scripts`
    # package (which shadowed DeepGEMM's build-time `from scripts.generate_pyi`).
    "openfold3 @ git+https://github.com/sfc-gh-goliaro/openfold-3.git@0ad77348bbdc71b7b028535ede809a71f87b3264",
    "pycocotools",
    "timm",
    "einops",
    "torchvision",
    "av",
    "rotary-embedding-torch",
    "fastsafetensors",
    "ultralytics",
    "flash-linear-attention>=0.4.2",
    # TTT-E2E benchmark (tests/bench_ttt_e2e.py): the official reference at
    # github.com/test-time-training/e2e is JAX/Equinox/Optax. We import its
    # MetaModel from a subprocess worker for cross-framework correctness +
    # throughput comparison.
    "jax[cuda12]",
    "equinox>=0.11.12",
    "optax>=0.2.4",
    "jaxtyping>=0.2.36",
    "hydra-core>=1.3",
    # DP3 bench (tests/bench_dp3.py): omegaconf is required by the
    # reference 3D-Diffusion-Policy repo for its OmegaConf-based configs;
    # pyarrow reads the xarm-pointcloud parquet shards; dill loads the
    # reference's dill-pickled checkpoints. ``datasets`` already pulls in
    # pyarrow and dill transitively, but we pin them here for clarity.
    "omegaconf",
    "pyarrow",
    "dill",
]

[project.scripts]
fastkernels = "fastkernels.__main__:main"

[tool.uv]
find-links = [
    "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/expanded_assets/v0.9.0",
]
no-build-isolation-package = ["flash-attn", "deep-gemm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastkernels*"]

[tool.setuptools.package-data]
"*" = ["*.cu", "*.cuh", "*.cpp", "*.cc", "*.h", "*.hpp", "*.yaml", "*.yml", "*.json", "*.jsonl", "*.md"]
